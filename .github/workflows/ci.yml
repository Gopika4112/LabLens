name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test (engines, web UI, API proxy)
        run: npm test
      - name: Engine accuracy table
        run: npm run bench >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: npm run build
